version: '3.8'

services:
  dataxray-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataxray_enterprise_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Optional: set an enterprise API key to guard /api/v1 endpoints
      - DATAXRAY_API_KEY=${DATAXRAY_API_KEY:-}
      - DEFAULT_REGION_PROFILE=${DEFAULT_REGION_PROFILE:-US}
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent volume for tenant run states, action ledgers, and audit logs
      - ./runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
