version: '3.8'

services:
  dataxray-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataxray_enterprise_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Multi-tenant security & JWT signing (set strong random secrets in production .env!)
      - DATAXRAY_API_KEY=${DATAXRAY_API_KEY:-}
      - DATAXRAY_JWT_SECRET=${DATAXRAY_JWT_SECRET:-}
      - DATAXRAY_REQUIRE_AUTH=${DATAXRAY_REQUIRE_AUTH:-false}
      - DATAXRAY_ALLOW_AI_CODEGEN=${DATAXRAY_ALLOW_AI_CODEGEN:-false}
      - DATAXRAY_CORS_ORIGINS=${DATAXRAY_CORS_ORIGINS:-http://localhost:8000}
      - DATAXRAY_RATE_LIMIT_RPM=${DATAXRAY_RATE_LIMIT_RPM:-120}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - DEFAULT_REGION_PROFILE=${DEFAULT_REGION_PROFILE:-US}
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent volume for tenant run states, action ledgers, and audit logs
      - ./runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
